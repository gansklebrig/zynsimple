name: Test

# Läuft bei jedem Hochladen: findet Tippfehler im Code und drückt im Mischpult zufällig alle Tasten/Knöpfe.
# Erst wenn das grün ist, wird eine Version auf „stabil“ gestellt (siehe ANLEITUNG, Abschnitt Updates).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyflakes
      - name: Code-Prüfung
        run: bash tests/statisch.sh
      - name: Tasten-Test (3 × 3000 zufällige Eingaben)
        run: |
          for s in 1 2 3; do python3 tests/fuzz.py 3000 $s | tail -25 || exit 1; done
